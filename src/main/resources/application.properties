spring.application.name=open5e-backend

# Defaults match the compose "db" service (docker compose up db); override with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:postgresql://localhost:5434/open5e
spring.datasource.username=nick
spring.datasource.password=open5e

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=open5e
# Lazy associations load inside service transactions only, never during response rendering.
spring.jpa.open-in-view=false
# Loads lazy associations (e.g. each creature's document) in batches rather than one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# List endpoints: ?page=0&pageSize=50&sort=name,asc. The page size parameter isn't "size", which is a filter on
# creatures and items.
spring.data.web.pageable.size-parameter=pageSize
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=500

# Sign-in (every profile except dev): bearer tokens from this OpenID Connect issuer, e.g. the Keycloak in
# compose.auth.yaml. Its keys are fetched on the first token, so the app starts without it.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/open5e}
spring.security.oauth2.resourceserver.jwt.audiences=open5e-api

# Flyway owns the schema; Hibernate only validates it against the entities.
spring.flyway.schemas=open5e
spring.flyway.default-schema=open5e
# Databases created before Flyway was added are marked as V1 instead of re-running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

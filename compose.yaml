# Local development stack: Postgres, plus the API.
#   docker compose up --build     start both (the first start restores docker/postgres/open5e_backup.dump, if present)
#   docker compose down -v        stop and delete the database volume (the next start restores again)
# Host ports can be changed with OPEN5E_DB_PORT (default 5434) and OPEN5E_APP_PORT (default 8080).

services:
  db:
    # postgres:18 plus the restore script (docker/postgres/Dockerfile)
    build: docker/postgres
    environment:
      POSTGRES_DB: open5e
      POSTGRES_USER: nick
      POSTGRES_PASSWORD: open5e
    ports:
      - "${OPEN5E_DB_PORT:-5434}:5432"
    volumes:
      - open5e-data:/var/lib/postgresql
      # The folder, not the dump file: mounting a file that doesn't exist would create a directory in its place.
      - ./docker/postgres:/dump:ro
    healthcheck:
      # Checks over TCP, which only comes up after the init restore has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nick -d open5e"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dev sign-in: choose the user per request with the X-User header (see README).
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/open5e
      SPRING_DATASOURCE_USERNAME: nick
      SPRING_DATASOURCE_PASSWORD: open5e
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "${OPEN5E_APP_PORT:-8080}:8080"

volumes:
  open5e-data:

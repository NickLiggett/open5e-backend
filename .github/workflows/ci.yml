name: CI

# Tests the backend against a real Postgres on every pull request and every push to main, and checks the Docker image
# still builds. Nothing is published from here (see the image workflow for that).

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request replaces the run still going for the old one; main is always run in full.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The tests use the same database the Compose file starts: localhost:5434, database open5e, user nick.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: open5e
          POSTGRES_USER: nick
          POSTGRES_PASSWORD: open5e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nick -d open5e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Starting the app creates the schema (Flyway), then the importer fills it with the default Open5e content, which
      # many tests read. It takes about a minute and needs api.open5e.com.
      - name: Load the default content from the Open5e API
        run: ./gradlew bootRun --args='--spring.profiles.active=import --open5e.import.mode=apply'

      - name: Test
        run: ./gradlew test

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds, doesn't publish: this is only to catch a Dockerfile that no longer works.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
